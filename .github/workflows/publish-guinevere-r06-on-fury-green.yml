        uses: actions/download-artifact@v4
        with:
          name: HIGHFLY-NEXUS-GUINEVERE-FURY-UNITY6-PREVIEW-WEBGL
          path: guinevere-r06-download
          repository: drakentzy07/HIGHFLY-NEXUS-UNITY
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Guinevere R06 FURY premium isolated preview
        shell: bash
        run: |
          set -euo pipefail
          INDEX="$(find guinevere-r06-download -type f -name index.html | head -1)"
