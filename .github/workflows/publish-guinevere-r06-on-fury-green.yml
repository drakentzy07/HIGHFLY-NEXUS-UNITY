          du -sh site-publish
          echo "FURY preview ready: /HIGHFLY-NEXUS-UNITY/preview/fury-s23-fix/"

      - name: Download successful FURY input hotfix WebGL artifact from RUN 40398525735
        uses: actions/download-artifact@v4
        with:
          name: HIGHFLY-NEXUS-GUINEVERE-FURY-UNITY6-PREVIEW-WEBGL
          path: fury-input-download
          repository: drakentzy07/HIGHFLY-NEXUS-UNITY
          run-id: '40398525735'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare FURY neutral-stick fixed preview (Unity6 GREEN)
