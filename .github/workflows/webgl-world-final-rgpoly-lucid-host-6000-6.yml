name: Build HIGHFLY RG Poly City01 on Unity 6000.6 Golden Host

on:
  workflow_dispatch:
  push:
    branches:
      - highfly/world-final-rgpoly-city01-v01
      - highfly/world-isekai-w0-w1-rgpoly-v01
      - highfly/world-w1-1-real-interiors-water-v01
    paths:
      - "Assets/Highfly/**"
      - "ci/world/**"
      - ".github/workflows/webgl-world-final-rgpoly-lucid-host-6000-6.yml"

permissions:
  contents: read

concurrency:
  group: highfly-rgpoly-lucid-host-6000-6
  cancel-in-progress: true

jobs:
  build:
    name: Unity 6000.6 Golden Host RG Poly City01
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout HIGHFLY
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Free disk
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Add swap for Unity import
        shell: bash
        run: |
          set -euxo pipefail
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          swapon --show

      - name: Download pinned Unity6 Lucid Golden Host
        shell: bash
        run: |
          set -euxo pipefail
          mkdir LucidHost
          git -C LucidHost init
          git -C LucidHost remote add origin https://github.com/DohunWi/3D-Action.git
          git -C LucidHost lfs install --local
          GIT_LFS_SKIP_SMUDGE=1 git -C LucidHost fetch --depth 1 origin da73b5be7ffa7216c48e196c4a69fe3ff66c6c65
          GIT_LFS_SKIP_SMUDGE=1 git -C LucidHost checkout --detach FETCH_HEAD
          git -C LucidHost lfs pull
          test -f LucidHost/3D_game/ProjectSettings/ProjectVersion.txt
          cat LucidHost/3D_game/ProjectSettings/ProjectVersion.txt

      - name: Prune optional Unity editor packages for lean CI
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          removable = [
              "com.unity.ai.assistant",
              "com.unity.collab-proxy",
              "com.unity.ide.rider",
              "com.unity.ide.visualstudio",
              "com.unity.multiplayer.center",
              "com.unity.performance.profile-analyzer",
              "com.unity.test-framework",
          ]

          manifest = Path("LucidHost/3D_game/Packages/manifest.json")
          data = json.loads(manifest.read_text())
          deps = data.setdefault("dependencies", {})
          for package in removable:
              removed = deps.pop(package, None)
              print("manifest", package, "removed=", removed is not None)
          manifest.write_text(json.dumps(data, indent=2) + "\n")

          lock = Path("LucidHost/3D_game/Packages/packages-lock.json")
          if lock.exists():
              ldata = json.loads(lock.read_text())
              ldeps = ldata.get("dependencies", {})
              for package in removable:
                  removed = ldeps.pop(package, None)
                  print("lock", package, "removed=", removed is not None)
              lock.write_text(json.dumps(ldata, indent=2) + "\n")
          PY

          for P in             com.unity.ai.assistant             com.unity.collab-proxy             com.unity.ide.rider             com.unity.ide.visualstudio             com.unity.multiplayer.center             com.unity.performance.profile-analyzer             com.unity.test-framework
          do
            ! grep -q "\"$P\"" LucidHost/3D_game/Packages/manifest.json
          done

          echo "=== Lean HIGHFLY CI package manifest ==="
          cat LucidHost/3D_game/Packages/manifest.json

      - name: Remove unused legacy host assets before Unity import
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "LucidHost/3D_game/Assets/UnityTechnologies/ParticlePack"
          rm -rf "LucidHost/3D_game/Assets/TextMesh Pro"

          # These legacy assets are not referenced by HIGHFLY WORLD and have
          # repeatedly entered Unity's Linux texture-compression crash path.
          test ! -d "LucidHost/3D_game/Assets/UnityTechnologies/ParticlePack"
          test ! -d "LucidHost/3D_game/Assets/TextMesh Pro"

      - name: Install current HIGHFLY core into Unity6 host
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf LucidHost/3D_game/Assets/Highfly
          cp -a Assets/Highfly LucidHost/3D_game/Assets/Highfly

          AROOT="LucidHost/3D_game/Assets/External/KayKit/Adventurers/addons/kaykit_character_pack_adventures"
          mkdir -p /tmp/kaykit-adventurers
          rm -rf /tmp/kaykit-adventurers
          git clone --depth 1 https://github.com/KayKit-Game-Assets/KayKit-Character-Pack-Adventures-1.0.git /tmp/kaykit-adventurers
          mkdir -p "$AROOT/Characters/fbx" "$AROOT/Assets/fbx"
          cp /tmp/kaykit-adventurers/addons/kaykit_character_pack_adventures/Characters/fbx/RogueHooded.fbx "$AROOT/Characters/fbx/"
          cp /tmp/kaykit-adventurers/addons/kaykit_character_pack_adventures/Characters/fbx/rogue_texture.png "$AROOT/Characters/fbx/"
          cp /tmp/kaykit-adventurers/addons/kaykit_character_pack_adventures/Characters/fbx/Barbarian.fbx "$AROOT/Characters/fbx/"
          cp /tmp/kaykit-adventurers/addons/kaykit_character_pack_adventures/Characters/fbx/barbarian_texture.png "$AROOT/Characters/fbx/"
          cp /tmp/kaykit-adventurers/addons/kaykit_character_pack_adventures/Assets/fbx/sword_1handed.fbx "$AROOT/Assets/fbx/"
          cp /tmp/kaykit-adventurers/addons/kaykit_character_pack_adventures/Assets/fbx/rogue_texture.png "$AROOT/Assets/fbx/" || true

          test -f LucidHost/3D_game/Assets/Highfly/Editor/HighflyBuildPipeline.cs
          test -f LucidHost/3D_game/Assets/Highfly/Editor/HighflyCombatLabBuilder.RgPoly.cs

      - name: Download official RG Poly Medieval Village FREE
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .hf-itch world-download
          npm --prefix .hf-itch init -y >/dev/null 2>&1
          npm --prefix .hf-itch install --no-save itchio-downloader@latest

          node <<'NODE'
          const path = require('path');
          const { downloadGame } = require(path.join(process.cwd(), '.hf-itch/node_modules/itchio-downloader'));
          (async () => {
            const result = await downloadGame({
              itchGameUrl: 'https://rg-poly.itch.io/stylized-medieval-village-unity-urp',
              downloadDirectory: path.join(process.cwd(), 'world-download'),
              desiredFileName: 'Stylized_Medieval_Village',
              resume: true,
              noCookieCache: true,
            });
            console.log(JSON.stringify(result, null, 2));
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

          PACKAGE="$(find world-download -type f \( -name '*.unitypackage' -o -name 'Stylized_Medieval_Village.zip' \) | head -n 1)"
          test -n "$PACKAGE"
          test -f "$PACKAGE"
          test "$(stat -c%s "$PACKAGE")" -eq 142787244
          python3 - "$PACKAGE" <<'PY'
          import hashlib, sys, tarfile
          p=sys.argv[1]
          if not tarfile.is_tarfile(p):
              raise SystemExit(f"Not a Unity tar package: {p}")
          h=hashlib.sha256()
          with open(p,'rb') as f:
              for chunk in iter(lambda:f.read(1024*1024), b''):
                  h.update(chunk)
          expected="34e2bf4ec08a7b9a1687a04b4e5c155648f3b1a31ff77ddb29812e821318a98d"
          digest=h.hexdigest()
          print("RG Poly sha256="+digest)
          if digest != expected:
              raise SystemExit(f"Unexpected digest: {digest}")
          PY
          echo "WORLD_PACKAGE=$PACKAGE" >> "$GITHUB_ENV"

      - name: Extract RG Poly into native Unity6 host
        shell: bash
        run: |
          set -euxo pipefail
          python3 ci/world/extract_unitypackage.py --package "$WORLD_PACKAGE" --project LucidHost/3D_game
          test -f "LucidHost/3D_game/Assets/Stylized Medieval Kingdom URP/Scenes/Demo Stylized Medieval.unity"
          test -f "LucidHost/3D_game/Assets/Stylized Medieval Kingdom URP/Prefabs/Wall/Wall_Gate Variant.prefab"

      - name: Download minimal Quaternius Forge donor
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf q-download q-stage
          mkdir -p q-download/props q-stage/props

          node <<'NODE'
          const path = require('path');
          const { downloadGame } = require(path.join(process.cwd(), '.hf-itch/node_modules/itchio-downloader'));

          (async () => {
            const result = await downloadGame({
              itchGameUrl: 'https://quaternius.itch.io/fantasy-props-megakit',
              downloadDirectory: path.join(process.cwd(), 'q-download/props'),
              desiredFileName: 'Fantasy Props MegaKit[Standard]',
              resume: true,
              noCookieCache: true,
            });
            console.log(JSON.stringify(result, null, 2));
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

          PROP_PACKAGE="$(find q-download/props -type f -name '*.zip' | head -n 1)"
          test -f "$PROP_PACKAGE"
          unzip -q "$PROP_PACKAGE" -d q-stage/props

          PROPS_DST="LucidHost/3D_game/Assets/External/Quaternius/FantasyPropsMegaKit"
          rm -rf "LucidHost/3D_game/Assets/External/Quaternius"
          mkdir -p "$PROPS_DST/Models"

          for NAME in Anvil Workbench; do
            SRC="$(find q-stage/props -type f -iname "$NAME.fbx" | head -n 1)"
            test -n "$SRC"
            cp "$SRC" "$PROPS_DST/Models/"
          done

          echo "=== HIGHFLY W1.1 minimal donor payload ==="
          find "$PROPS_DST" -type f -printf '%p %k KB\n' | sort
          du -sh "$PROPS_DST"
          test "$(find "$PROPS_DST" -type f -iname '*.fbx' | wc -l)" -eq 2
          test -f "$PROPS_DST/Models/Anvil.fbx"
          test -f "$PROPS_DST/Models/Workbench.fbx"

      - name: Audit W1.1 reusable interior donors
        shell: bash
        run: |
          set -euxo pipefail
          python3 ci/world/audit_w1_1_donors.py \
            "LucidHost/3D_game/Assets/Stylized Medieval Kingdom URP" \
            "LucidHost/3D_game/build/diagnostics"
          cat LucidHost/3D_game/build/diagnostics/w1-1-rgpoly-donor-summary.txt

      - name: Restore Unity6 host Library cache
        id: host-cache
        uses: actions/cache/restore@v4
        with:
          path: LucidHost/3D_game/Library
          key: rgpoly-goldenhost-6000.6-v3-lean-${{ hashFiles('Assets/Highfly/**', 'ci/world/**') }}
          restore-keys: |
            rgpoly-goldenhost-6000.6-v3-lean-

      - name: Prepare CITY01 on native Unity6 host — attempt 1
        id: prepare1
        continue-on-error: true
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: LucidHost/3D_game
          unityVersion: 6000.6.2f1
          targetPlatform: WebGL
          buildsPath: build/prepare
          buildName: HIGHFLY-RGPOLY-PREPARE
          buildMethod: Highfly.Editor.HighflyBuildPipeline.PrepareWebGLRgPolyWorld
          customParameters: -job-worker-count 1 -disableManagedDebugger
          allowDirtyBuild: true

      - name: Prepare CITY01 retry after transient Unity crash
        if: steps.prepare1.outcome == 'failure'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: LucidHost/3D_game
          unityVersion: 6000.6.2f1
          targetPlatform: WebGL
          buildsPath: build/prepare
          buildName: HIGHFLY-RGPOLY-PREPARE
          buildMethod: Highfly.Editor.HighflyBuildPipeline.PrepareWebGLRgPolyWorld
          customParameters: -job-worker-count 1 -disableManagedDebugger
          allowDirtyBuild: true

      - name: Verify prepared CITY01
        shell: bash
        run: |
          set -euxo pipefail
          SCENE="LucidHost/3D_game/Assets/Highfly/Scenes/WorldLab.unity"
          test -f "$SCENE"
          grep -q "HIGHFLY_RG_POLY_CITY01" "$SCENE"
          grep -q "HIGHFLY_Hunter" "$SCENE"
          grep -q "HIGHFLY_MobileHUD" "$SCENE"
          du -sh LucidHost/3D_game/Library || true

      - name: Save Unity6 host Library before build
        if: steps.host-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: LucidHost/3D_game/Library
          key: rgpoly-goldenhost-6000.6-v3-lean-${{ hashFiles('Assets/Highfly/**', 'ci/world/**') }}

      - name: Build prepared CITY01 WebGL on native Unity6 host
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: LucidHost/3D_game
          unityVersion: 6000.6.2f1
          targetPlatform: WebGL
          buildsPath: build
          buildName: HIGHFLY-WORLD-RGPOLY
          buildMethod: Highfly.Editor.HighflyBuildPipeline.BuildPreparedWebGLRgPolyWorld
          customParameters: -job-worker-count 1 -disableManagedDebugger
          allowDirtyBuild: true

      - name: Inspect output
        if: always()
        shell: bash
        run: |
          find build -maxdepth 5 -type f -printf "%p %k KB\n" | sort | head -300 || true
          find LucidHost/3D_game/build/diagnostics -maxdepth 2 -type f -print -exec cat {} \; || true

      - name: Upload WebGL
        uses: actions/upload-artifact@v4
        with:
          name: HIGHFLY-RGPOLY-CITY01-GOLDENHOST-6000-6-WEBGL-v0.1
          path: build/WebGL/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HIGHFLY-RGPOLY-CITY01-GOLDENHOST-6000-6-DIAGNOSTICS-v0.1
          path: LucidHost/3D_game/build/diagnostics/**
          if-no-files-found: warn
          retention-days: 7
