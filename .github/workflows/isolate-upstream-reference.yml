name: Isolate Upstream Reference

on:
  push:
    paths:
      - '.github/workflows/isolate-upstream-reference.yml'

permissions:
  contents: write

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: highfly-foundation
          fetch-depth: 0
          lfs: true

      - name: Preserve upstream outside Unity compilation domain
        run: |
          mkdir -p UpstreamReference

          if [ -d Assets/SubspaceHunter ]; then
            git mv Assets/SubspaceHunter UpstreamReference/SubspaceHunter
          fi
          if [ -f Assets/SubspaceHunter.meta ]; then
            git mv Assets/SubspaceHunter.meta UpstreamReference/SubspaceHunter.meta
          fi

          if [ -d Assets/PublicDemo ]; then
            git mv Assets/PublicDemo UpstreamReference/PublicDemo
          fi
          if [ -f Assets/PublicDemo.meta ]; then
            git mv Assets/PublicDemo.meta UpstreamReference/PublicDemo.meta
          fi

          cat > UpstreamReference/README.md <<'EOF'
          # SubspaceHunter upstream reference

          This directory preserves the imported public SubspaceHunter-SAO source and demo content for inspection and selective migration.

          It intentionally lives outside Unity's `Assets/` directory on the `highfly-foundation` branch so missing external plugins/assets cannot prevent the clean HIGHFLY Android Combat Lab from compiling.

          The untouched imported project remains preserved on `main`.

          Systems are migrated into `Assets/Highfly/` only after dependency and license review.
          EOF

          rm -f .github/workflows/isolate-upstream-reference.yml

      - name: Commit isolated foundation safely
        run: |
          git config user.name 'highfly-foundation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Isolate upstream reference from clean HIGHFLY compile domain'
          git fetch origin highfly-foundation
          git rebase origin/highfly-foundation
          git push origin HEAD:highfly-foundation
