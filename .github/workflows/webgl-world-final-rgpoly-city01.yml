name: Build HIGHFLY World Final RG Poly City01

on:
  workflow_dispatch:
  push:
    branches:
      - highfly/world-final-rgpoly-city01-v01
    paths:
      - "Assets/Highfly/**"
      - "ci/world/**"
      - ".github/workflows/webgl-world-final-rgpoly-city01.yml"
      - "Packages/**"
      - "ProjectSettings/**"

permissions:
  contents: read

concurrency:
  group: highfly-world-final-rgpoly-city01
  cancel-in-progress: true

jobs:
  build:
    name: Unity WebGL RG Poly City01
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout HIGHFLY Unity
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Upgrade package manifest for Unity 6000 URP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("Packages/manifest.json")
          d=json.loads(p.read_text())
          deps=d.setdefault("dependencies", {})
          deps["com.unity.render-pipelines.core"]="17.4.0"
          deps["com.unity.render-pipelines.universal"]="17.4.0"
          deps["com.unity.render-pipelines.universal-config"]="17.4.0"
          deps["com.unity.shadergraph"]="17.4.0"
          deps["com.unity.ugui"]="2.0.0"
          deps["com.unity.test-framework"]="1.6.0"
          deps["com.unity.modules.terrain"]="1.0.0"
          deps["com.unity.modules.terrainphysics"]="1.0.0"
          deps["com.unity.modules.wind"]="1.0.0"
          p.write_text(json.dumps(d, indent=2)+"\n")
          print(p.read_text())
          PY

      - name: Stage KayKit hunter
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/kaykit-adventurers
          git clone --depth 1 https://github.com/KayKit-Game-Assets/KayKit-Character-Pack-Adventures-1.0.git /tmp/kaykit-adventurers

          AROOT="Assets/External/KayKit/Adventurers/addons/kaykit_character_pack_adventures"
          mkdir -p "$AROOT/Characters/fbx" "$AROOT/Assets/fbx"
          cp /tmp/kaykit-adventurers/addons/kaykit_character_pack_adventures/Characters/fbx/RogueHooded.fbx "$AROOT/Characters/fbx/"
          cp /tmp/kaykit-adventurers/addons/kaykit_character_pack_adventures/Characters/fbx/rogue_texture.png "$AROOT/Characters/fbx/"
          cp /tmp/kaykit-adventurers/addons/kaykit_character_pack_adventures/Assets/fbx/sword_1handed.fbx "$AROOT/Assets/fbx/"
          cp /tmp/kaykit-adventurers/addons/kaykit_character_pack_adventures/Assets/fbx/rogue_texture.png "$AROOT/Assets/fbx/" || true

          mkdir -p Assets/Highfly/ThirdPartyNotices
          cp /tmp/kaykit-adventurers/LICENSE.txt Assets/Highfly/ThirdPartyNotices/KayKit-Adventurers-CC0.txt

      - name: Download official RG Poly Medieval Village FREE
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .hf-itch world-download
          npm --prefix .hf-itch init -y >/dev/null 2>&1
          npm --prefix .hf-itch install --no-save itchio-downloader@latest

          node <<'NODE'
          const path = require('path');
          const { downloadGame } = require(path.join(process.cwd(), '.hf-itch/node_modules/itchio-downloader'));

          (async () => {
            const result = await downloadGame({
              itchGameUrl: 'https://rg-poly.itch.io/stylized-medieval-village-unity-urp',
              downloadDirectory: path.join(process.cwd(), 'world-download'),
              desiredFileName: 'Stylized_Medieval_Village',
              resume: true,
              noCookieCache: true,
            });
            console.log('[HF-WORLD] itch download result:', JSON.stringify(result, null, 2));
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

          PACKAGE="$(find world-download -type f \( -name '*.unitypackage' -o -name 'Stylized_Medieval_Village.zip' \) | head -n 1)"
          test -n "$PACKAGE"
          test -f "$PACKAGE"
          test "$(stat -c%s "$PACKAGE")" -eq 142787244

          python3 - "$PACKAGE" <<'PY'
          import hashlib, sys, tarfile
          p=sys.argv[1]
          if not tarfile.is_tarfile(p):
              raise SystemExit(f"Downloaded file is not a Unity tar package: {p}")
          h=hashlib.sha256()
          with open(p,'rb') as f:
              for chunk in iter(lambda:f.read(1024*1024), b''):
                  h.update(chunk)
          digest=h.hexdigest()
          expected="34e2bf4ec08a7b9a1687a04b4e5c155648f3b1a31ff77ddb29812e821318a98d"
          print("[HF-WORLD] package sha256="+digest)
          if digest != expected:
              raise SystemExit(f"Unexpected RG Poly package digest: {digest}")
          PY

          echo "WORLD_PACKAGE=$PACKAGE" >> "$GITHUB_ENV"

      - name: Extract RG Poly package into HIGHFLY project
        shell: bash
        run: |
          set -euxo pipefail
          python3 ci/world/extract_unitypackage.py             --package "$WORLD_PACKAGE"             --project .

          test -f "Assets/Stylized Medieval Kingdom URP/Scenes/Demo Stylized Medieval.unity"
          test -f "Assets/Stylized Medieval Kingdom URP/Prefabs/Wall/Wall_Gate Variant.prefab"
          test -f "Assets/Stylized Medieval Kingdom URP/Prefabs/WatermillWheel Variant.prefab"

      - name: Restore prepared Unity Library cache
        id: rgpoly-library-cache
        uses: actions/cache/restore@v4
        with:
          path: Library
          key: Library-6000.4.0f1-WebGL-RGPolyCity01-v2-${{ hashFiles('Assets/Highfly/**', 'ci/world/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-6000.4.0f1-WebGL-RGPolyCity01-v2-
            Library-6000.4.0f1-WebGL-RGPolyCity01-
            Library-6000.4.0f1-WebGL-

      - name: Free disk for Unity
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Prepare full RG Poly City01 in Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.4.0f1
          targetPlatform: WebGL
          buildsPath: build/prepare
          buildName: HIGHFLY-RGPOLY-PREPARE
          buildMethod: Highfly.Editor.HighflyBuildPipeline.PrepareWebGLRgPolyWorld
          allowDirtyBuild: true

      - name: Verify prepared City01 scene
        shell: bash
        run: |
          set -euxo pipefail
          test -f "Assets/Highfly/Scenes/WorldLab.unity"
          grep -q "HIGHFLY_RG_POLY_CITY01" "Assets/Highfly/Scenes/WorldLab.unity"
          grep -q "HIGHFLY_Hunter" "Assets/Highfly/Scenes/WorldLab.unity"
          grep -q "HIGHFLY_MobileHUD" "Assets/Highfly/Scenes/WorldLab.unity"
          du -sh Library || true
          du -sh Assets/Highfly/Scenes/WorldLab.unity || true

      - name: Save prepared Unity Library cache before heavy build
        if: steps.rgpoly-library-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Library
          key: Library-6000.4.0f1-WebGL-RGPolyCity01-v2-${{ hashFiles('Assets/Highfly/**', 'ci/world/**', 'Packages/**', 'ProjectSettings/**') }}

      - name: Upload prepared City01 diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: HIGHFLY-RGPOLY-CITY01-PREPARED-v0.2
          path: |
            Assets/Highfly/Scenes/WorldLab.unity
            build/diagnostics/**
          if-no-files-found: error
          retention-days: 3

      - name: Build prepared HIGHFLY RG Poly City01 WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.4.0f1
          targetPlatform: WebGL
          buildsPath: build
          buildName: HIGHFLY-WORLD-RGPOLY
          buildMethod: Highfly.Editor.HighflyBuildPipeline.BuildPreparedWebGLRgPolyWorld
          allowDirtyBuild: true

      - name: Patch WebGL for mobile fullscreen
        shell: bash
        run: |
          set -euo pipefail
          INDEX="$(find build/WebGL -type f -name index.html | head -1)"
          test -f "$INDEX"
          ROOT="$(dirname "$INDEX")"
          sudo chown -R "$(id -u):$(id -g)" "$ROOT"

          python3 - "$INDEX" <<'PY'
          from pathlib import Path
          import os, re, sys
          p=Path(sys.argv[1])
          s=p.read_text(encoding="utf-8")
          version=os.environ.get("GITHUB_RUN_ID","dev")
          s=re.sub(r'((?:[^"/]+)\.(?:loader\.js|framework\.js|wasm|data))"',
                   lambda m:m.group(1)+'?v='+version+'"', s)
          head=r'''
          <meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
          <meta name="mobile-web-app-capable" content="yes">
          <meta name="screen-orientation" content="landscape">
          <style>
          html,body{margin:0!important;padding:0!important;width:100%!important;height:100%!important;overflow:hidden!important;background:#08121d!important}
          #unity-container,#unity-container.unity-desktop,#unity-container.unity-mobile{position:fixed!important;inset:0!important;transform:none!important;width:100vw!important;height:100dvh!important;max-width:none!important;max-height:none!important}
          #unity-canvas,#unity-canvas.unity-mobile{position:absolute!important;inset:0!important;width:100vw!important;height:100dvh!important;max-width:none!important;max-height:none!important;display:block!important}
          #unity-footer,#unity-logo,#unity-webgl-logo{display:none!important}
          #highfly-enter{position:fixed;inset:0;z-index:99999;background:#08121d;display:none;align-items:center;justify-content:center;font-family:Arial,sans-serif}
          #highfly-enter button{font-size:22px;font-weight:700;padding:18px 28px;border-radius:12px;border:1px solid #5ee8ff;background:#102c42;color:white}
          </style>
          '''
          boot=r'''
          <div id="highfly-enter"><button type="button">ENTRAR A HIGHFLY</button></div>
          <script>
          (() => {
            const mobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            const overlay=document.getElementById("highfly-enter");
            const button=overlay?overlay.querySelector("button"):null;
            if(mobile&&overlay) overlay.style.display="flex";
            const fit=()=>{
              const c=document.getElementById("unity-container");
              const v=document.getElementById("unity-canvas");
              if(c){c.className="unity-mobile";c.style.width="100vw";c.style.height="100dvh";}
              if(v){v.className="unity-mobile";v.style.width="100vw";v.style.height="100dvh";}
            };
            const enter=async()=>{
              fit();
              try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();}catch(_){}
              try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock("landscape");}catch(_){}
              if(overlay)overlay.style.display="none";
            };
            if(button)button.addEventListener("click",enter);
            window.addEventListener("resize",fit);
            window.addEventListener("orientationchange",fit);
            fit();
          })();
          </script>
          '''
          s=s.replace("unityShowBanner('WebGL builds are not supported on mobile devices.');","")
          if "viewport-fit=cover" not in s: s=s.replace("</head>",head+"\n</head>")
          if 'id="highfly-enter"' not in s: s=s.replace("</body>",boot+"\n</body>")
          s=s.replace("</head>",f'<meta name="highfly-build" content="{version}">\n</head>',1)
          p.write_text(s,encoding="utf-8")
          print("Patched",p)
          PY

      - name: Inspect RG Poly City01 build
        if: always()
        shell: bash
        run: |
          find build -maxdepth 5 -type f -printf "%p %k KB\n" | sort | head -300 || true
          find build/diagnostics -maxdepth 2 -type f -print -exec cat {} \; || true

      - name: Upload RG Poly City01 WebGL
        uses: actions/upload-artifact@v4
        with:
          name: HIGHFLY-WORLD-RGPOLY-CITY01-WEBGL-v0.1
          path: build/WebGL/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HIGHFLY-WORLD-RGPOLY-CITY01-DIAGNOSTICS-v0.1
          path: build/diagnostics/**
          if-no-files-found: warn
          retention-days: 7
