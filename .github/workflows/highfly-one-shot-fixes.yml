name: HIGHFLY One-Shot Foundation Fixes

on:
  push:
    paths:
      - '.github/workflows/highfly-one-shot-fixes.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: highfly-foundation
          fetch-depth: 0
      - name: Apply source fixes
        run: |
          sed -i '/scene.name = "HIGHFLY_CombatLab";/d' Assets/Highfly/Editor/HighflyCombatLabBuilder.cs
          rm -f .github/workflows/highfly-one-shot-fixes.yml
      - name: Commit fixes and self-clean
        run: |
          git config user.name 'highfly-foundation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Combat Lab builder scene API and clean one-shot workflow'
          git push origin HEAD:highfly-foundation
