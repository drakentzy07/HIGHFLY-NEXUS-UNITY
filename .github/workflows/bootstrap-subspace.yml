name: Bootstrap SubspaceHunter Foundation

on:
  push:
    paths:
      - '.github/workflows/bootstrap-subspace.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HIGHFLY repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone SubspaceHunter-SAO upstream
        run: |
          rm -rf /tmp/subspacehunter
          git clone --depth 1 https://github.com/whx-prog/SubspaceHunter-SAO.git /tmp/subspacehunter

      - name: Import Unity project foundation
        run: |
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            /tmp/subspacehunter/ ./

          mkdir -p Assets/Highfly/Core
          mkdir -p Assets/Highfly/Combat
          mkdir -p Assets/Highfly/Mobile
          mkdir -p Assets/Highfly/UI
          mkdir -p Assets/Highfly/World
          mkdir -p Assets/Highfly/Editor
          mkdir -p docs/highfly

          cat > docs/highfly/UPSTREAM.md <<'EOF'
          # Upstream foundation

          Base imported from `whx-prog/SubspaceHunter-SAO`.

          The upstream MIT license is retained. HIGHFLY must not ship SAO/IP-specific non-commercial assets or unverified third-party packages. Those items are reference/dependency material until explicitly cleared.
          EOF

          cat > docs/highfly/ROADMAP.md <<'EOF'
          # HIGHFLY NEXUS — initial roadmap

          ## Stage 0 — Foundation
          - Import and preserve upstream Unity project.
          - Audit dependencies/assets.
          - Establish Android CI.

          ## Stage 1 — Combat Lab
          - Third-person mobile controller.
          - Left joystick / right camera zone.
          - Combo, heavy, dash, dodge, block/parry.
          - Smart target acquisition and target switching.
          - Cleave, cone and AoE hit queries.
          - Enemy/miniboss combat loop.

          ## Stage 2 — HIGHFLY RPG
          - Classes, weapons and skill kits.
          - Gates, tower, loot and inventory.
          - Fitness training -> persistent character stats.

          ## Stage 3 — World/MMO
          - HIGHFLY city and functional buildings.
          - Party/guild/social systems.
          - Server/network layer introduced incrementally.
          EOF

      - name: Record upstream revision
        run: |
          UPSTREAM_SHA=$(git -C /tmp/subspacehunter rev-parse HEAD)
          echo "$UPSTREAM_SHA" > docs/highfly/SUBSPACEHUNTER_UPSTREAM_SHA.txt

      - name: Commit imported foundation
        run: |
          git config user.name 'highfly-bootstrap-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Bootstrap SubspaceHunter Unity foundation [skip ci]'
            git push origin HEAD:main
          fi
