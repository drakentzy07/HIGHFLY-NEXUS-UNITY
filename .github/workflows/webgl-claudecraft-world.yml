name: Build HIGHFLY ClaudeCraft World WebGL

on:
  workflow_dispatch:
  push:
    branches:
      - highfly/claudecraft-world-importer-v01
    paths:
      - "Assets/Highfly/World/HighflyClaudeWorldRuntime.cs"
      - "Assets/Highfly/Editor/HighflyBuildPipeline.cs"
      - ".github/workflows/webgl-claudecraft-world.yml"

permissions:
  contents: read

concurrency:
  group: highfly-claudecraft-world-webgl
  cancel-in-progress: true

jobs:
  webgl-world:
    name: Unity WebGL ClaudeCraft World
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout HIGHFLY Unity
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Fetch ClaudeCraft Unity world data
        run: |
          mkdir -p Assets/Highfly/Resources/ClaudeCraft
          curl -L --fail --retry 12 --retry-delay 5 --retry-all-errors             https://raw.githubusercontent.com/drakentzy07/HIGHFLY-NEXT-CORE/world-data-v0433/unity-world-v01.json             -o Assets/Highfly/Resources/ClaudeCraft/world.json
          test -s Assets/Highfly/Resources/ClaudeCraft/world.json
          python3 - <<'PY'
          import json
          p="Assets/Highfly/Resources/ClaudeCraft/world.json"
          d=json.load(open(p,encoding="utf-8"))
          print("schema", d.get("schema"))
          print("zones", len(d.get("zones",[])))
          print("terrain", len(d.get("terrain",[])))
          print("roads", len(d.get("roads",[])))
          print("camps", len(d.get("camps",[])))
          print("gather", len(d.get("gatherNodes",[])))
          print("props", len(d.get("props",[])))
          print("decorations", len(d.get("decorations",[])))
          from collections import Counter
          print("prop categories", Counter(str(x.get("category","")).lower() for x in d.get("props",[])).most_common(30))
          print("decoration kinds", Counter(str(x.get("kind","")).lower() for x in d.get("decorations",[])).most_common(30))
          assert d.get("schema") == "highfly-unity-world-v01"
          assert len(d.get("terrain",[])) > 0
          PY

      - name: Export authored ClaudeCraft entities for WORLD v0.3
        run: |
          set -euo pipefail
          rm -rf /tmp/claudecraft-v0433
          git clone --branch v0.43.3 --depth 1 https://github.com/levy-street/world-of-claudecraft.git /tmp/claudecraft-v0433
          cd /tmp/claudecraft-v0433
          cat > highfly-unity-entities.mts <<'TS'
          import fs from 'node:fs';
          import {
            NPCS,
            MOBS,
            DUNGEON_LIST,
            STATIONS,
            GROUND_OBJECTS,
            PROPS,
            ROADS,
            ZONES,
            PLAYER_START,
          } from './src/sim/data.ts';

          const npcRole = (n: any): string => {
            if (n.banker) return 'banker';
            if (n.market) return 'market';
            if (n.farmer) return 'farmer';
            if (n.warfareVendor) return 'guard';
            if (Array.isArray(n.vendorItems) && n.vendorItems.length) return 'vendor';
            if (Array.isArray(n.questIds) && n.questIds.length) return 'quest';
            const id = String(n.id ?? '').toLowerCase();
            if (id.includes('marshal') || id.includes('warden') || id.includes('guard')) return 'guard';
            if (id.includes('priest') || id.includes('apothecary') || id.includes('mage')) return 'mage';
            return 'civilian';
          };

          const npcs = Object.values(NPCS)
            .filter((n: any) => !n.dynamic && n.pos && Number.isFinite(n.pos.x) && Number.isFinite(n.pos.z))
            .map((n: any) => ({
              id: String(n.id ?? ''),
              name: String(n.name ?? n.id ?? 'Habitante'),
              title: String(n.title ?? ''),
              role: npcRole(n),
              greeting: String(n.greeting ?? ''),
              x: Number(n.pos.x),
              z: Number(n.pos.z),
              facing: Number(n.facing ?? 0),
              color: Number(n.color ?? 0xffffff),
              questCount: Array.isArray(n.questIds) ? n.questIds.length : 0,
            }));

          const dungeons = DUNGEON_LIST
            .filter((d: any) => d.overworldDoor !== false && d.doorPos)
            .map((d: any) => ({
              id: String(d.id ?? ''),
              name: String(d.name ?? d.id ?? 'Mazmorra'),
              interior: String(d.interior ?? ''),
              enterText: String(d.enterText ?? ''),
              leaveText: String(d.leaveText ?? ''),
              x: Number(d.doorPos.x),
              z: Number(d.doorPos.z),
              suggestedPlayers: Number(d.suggestedPlayers ?? 1),
              staticDoor: Boolean(d.staticDoor),
            }));

          const mobs = Object.values(MOBS).map((m: any) => ({
            id: String(m.id ?? ''),
            name: String(m.name ?? m.id ?? ''),
            family: String(m.family ?? ''),
            scale: Number(m.scale ?? 1),
            color: Number(m.color ?? 0xffffff),
            elite: Boolean(m.elite),
            rare: Boolean(m.rare),
            boss: Boolean(m.boss),
          }));

          const rawStations: any[] = Array.isArray(STATIONS)
            ? STATIONS as any[]
            : Object.values(STATIONS as any);
          const stations = rawStations
            .filter((s: any) => s && s.pos && Number.isFinite(s.pos.x) && Number.isFinite(s.pos.z))
            .map((s: any, i: number) => ({
              id: String(s.id ?? ('station_' + i)),
              type: String(s.type ?? s.kind ?? 'station'),
              x: Number(s.pos.x),
              z: Number(s.pos.z),
            }));

          const objects: any[] = [];
          for (const def of GROUND_OBJECTS as any[]) {
            const placements = Array.isArray(def.positions) ? def.positions : (def.pos ? [def.pos] : []);
            placements.forEach((p: any, i: number) => {
              if (!p || !Number.isFinite(p.x) || !Number.isFinite(p.z)) return;
              objects.push({
                id: String(def.id ?? def.itemId ?? 'object') + '_' + i,
                name: String(def.name ?? def.itemId ?? 'Objeto'),
                templateId: String(def.templateId ?? ''),
                x: Number(p.x),
                z: Number(p.z),
              });
            });
          }

          const out = {
            schema: 'highfly-claudecraft-world-entities-v03',
            source: 'levy-street/world-of-claudecraft@v0.43.3',
            npcs,
            dungeons,
            mobs,
            stations,
            objects,
          };

          const categoryAliases: Record<string, string> = {
            greatTrees: 'greattrees',
            decorProps: 'decorprops',
            mudHuts: 'mudhuts',
            ruinRings: 'ruinrings',
            marshReeds: 'marshreeds',
            delveMarkers: 'delvemarkers',
          };

          const num = (v: any, fallback = 0): number =>
            Number.isFinite(Number(v)) ? Number(v) : fallback;

          const props: any[] = [];
          for (const [rawCategory, rawEntries] of Object.entries(PROPS as any)) {
            if (!Array.isArray(rawEntries)) continue;
            const category = categoryAliases[rawCategory] ?? rawCategory.toLowerCase();

            rawEntries.forEach((raw: any, index: number) => {
              const p: any = Array.isArray(raw)
                ? { x: raw[0], z: raw[1] }
                : (raw ?? {});

              const x = num(p.x ?? p.x1);
              const z = num(p.z ?? p.z1);
              const x2 = num(p.x2, x);
              const z2 = num(p.z2, z);
              const width = num(p.width ?? p.w ?? (p.hw != null ? Number(p.hw) * 2 : 0));
              const depth = num(p.depth ?? p.d ?? (p.hd != null ? Number(p.hd) * 2 : 0));
              const radius = num(p.radius ?? p.r ?? p.ringR);
              const height = num(p.height ?? p.h);
              const assetId = String(p.assetId ?? '');
              const key = String(p.key ?? assetId ?? '');
              const kind = String(p.kind ?? assetId ?? key ?? category);

              props.push({
                id: String(p.id ?? (category + '_' + index)),
                category,
                kind,
                assetId,
                key,
                x,
                z,
                x2,
                z2,
                rot: num(p.rot ?? p.rotation),
                scale: num(p.scale, 1),
                radius,
                width,
                depth,
                height,
                count: num(p.count, 1),
              });
            });
          }

          const roads = (ROADS as any[]).map((road: any, index: number) => ({
            id: String(road.id ?? ('road_' + index)),
            points: (road.points ?? road.path ?? [])
              .filter((p: any) => p && Number.isFinite(Number(p.x)) && Number.isFinite(Number(p.z)))
              .map((p: any) => ({ x: Number(p.x), z: Number(p.z) })),
          })).filter((road: any) => road.points.length >= 2);

          const zones = (ZONES as any[]).map((zone: any) => ({
            id: String(zone.id ?? ''),
            name: String(zone.name ?? zone.id ?? ''),
            biome: String(zone.biome ?? ''),
            xMin: num(zone.xMin, -180),
            xMax: num(zone.xMax, 180),
            zMin: num(zone.zMin),
            zMax: num(zone.zMax),
            hub: zone.hub ? { x: num(zone.hub.x), z: num(zone.hub.z) } : null,
          }));

          const eastbrook = zones.find((zone: any) => zone.id === 'eastbrook_vale');
          const citySpawn = eastbrook?.hub ?? { x: num((PLAYER_START as any).x), z: num((PLAYER_START as any).z) };
          const structure = {
            schema: 'highfly-claudecraft-world-structure-v031',
            source: 'levy-street/world-of-claudecraft@v0.43.3',
            citySpawn,
            zones,
            roads,
            props,
          };

          const outPath = process.env.HIGHFLY_ENTITIES_OUT;
          if (!outPath) throw new Error('HIGHFLY_ENTITIES_OUT missing');
          fs.writeFileSync(outPath, JSON.stringify(out));

          const structurePath = process.env.HIGHFLY_STRUCTURE_OUT;
          if (!structurePath) throw new Error('HIGHFLY_STRUCTURE_OUT missing');
          fs.writeFileSync(structurePath, JSON.stringify(structure));

          console.log(JSON.stringify({
            schema: out.schema,
            npcs: npcs.length,
            dungeons: dungeons.length,
            mobs: mobs.length,
            stations: stations.length,
            objects: objects.length,
            structureSchema: structure.schema,
            structureProps: props.length,
            structureRoads: roads.length,
            structureZones: zones.length,
            citySpawn,
            propCategories: Object.fromEntries(
              [...new Set(props.map((p: any) => p.category))]
                .sort()
                .map((category: string) => [category, props.filter((p: any) => p.category === category).length])
            ),
          }, null, 2));
          TS
          mkdir -p "$GITHUB_WORKSPACE/Assets/Highfly/Resources/ClaudeCraft"
          HIGHFLY_ENTITIES_OUT="$GITHUB_WORKSPACE/Assets/Highfly/Resources/ClaudeCraft/entities.json" \
          HIGHFLY_STRUCTURE_OUT="$GITHUB_WORKSPACE/Assets/Highfly/Resources/ClaudeCraft/structure.json" \
            npx --yes tsx@4.22.4 highfly-unity-entities.mts
          test -s "$GITHUB_WORKSPACE/Assets/Highfly/Resources/ClaudeCraft/entities.json"
          test -s "$GITHUB_WORKSPACE/Assets/Highfly/Resources/ClaudeCraft/structure.json"
          cd "$GITHUB_WORKSPACE"

      - name: Stage official CC0 KayKit visuals
        run: |
          rm -rf /tmp/kaykit-adventurers /tmp/kaykit-medieval
          git clone --depth 1 https://github.com/KayKit-Game-Assets/KayKit-Character-Pack-Adventures-1.0.git /tmp/kaykit-adventurers
          git clone --depth 1 https://github.com/KayKit-Game-Assets/KayKit-Medieval-Hexagon-Pack-1.0.git /tmp/kaykit-medieval

          AROOT="Assets/External/KayKit/Adventurers/addons/kaykit_character_pack_adventures"
          mkdir -p "$AROOT/Characters/fbx" "$AROOT/Assets/fbx"
          cp /tmp/kaykit-adventurers/addons/kaykit_character_pack_adventures/Characters/fbx/RogueHooded.fbx "$AROOT/Characters/fbx/"
          cp /tmp/kaykit-adventurers/addons/kaykit_character_pack_adventures/Characters/fbx/rogue_texture.png "$AROOT/Characters/fbx/"
          cp /tmp/kaykit-adventurers/addons/kaykit_character_pack_adventures/Assets/fbx/sword_1handed.fbx "$AROOT/Assets/fbx/"
          cp /tmp/kaykit-adventurers/addons/kaykit_character_pack_adventures/Assets/fbx/rogue_texture.png "$AROOT/Assets/fbx/" || true

          SRC="/tmp/kaykit-medieval/addons/kaykit_medieval_hexagon_pack/Assets/fbx"
          DST="Assets/Highfly/Resources/ClaudeWorldAssets"
          mkdir -p "$DST/buildings/blue" "$DST/buildings/neutral" "$DST/nature" "$DST/props" "$DST/characters"

          CHAR_SRC="/tmp/kaykit-adventurers/addons/kaykit_character_pack_adventures/Characters/fbx"
          for n in Barbarian Knight Mage Rogue RogueHooded; do
            cp "$CHAR_SRC/$n.fbx" "$DST/characters/"
          done
          for tex in barbarian_texture knight_texture mage_texture rogue_texture; do
            cp "$CHAR_SRC/$tex.png" "$DST/characters/"
          done

          for n in building_home_A_blue building_home_B_blue building_tavern_blue building_blacksmith_blue building_market_blue building_church_blue building_mine_blue building_well_blue building_lumbermill_blue building_windmill_blue building_watermill_blue building_tower_A_blue building_castle_blue building_barracks_blue building_archeryrange_blue; do
            cp "$SRC/buildings/blue/$n.fbx" "$DST/buildings/blue/"
          done
          cp "$SRC/buildings/blue/hexagons_medieval.png" "$DST/buildings/blue/"

          for n in building_bridge_A building_bridge_B building_destroyed wall_straight wall_straight_gate fence_wood_straight fence_stone_straight; do
            cp "$SRC/buildings/neutral/$n.fbx" "$DST/buildings/neutral/"
          done
          cp "$SRC/buildings/neutral/hexagons_medieval.png" "$DST/buildings/neutral/"

          for n in tree_single_A tree_single_B trees_A_small trees_A_medium trees_A_large rock_single_A rock_single_B rock_single_C waterlily_A waterplant_A waterplant_B; do
            cp "$SRC/decoration/nature/$n.fbx" "$DST/nature/"
          done
          cp "$SRC/decoration/nature/hexagons_medieval.png" "$DST/nature/"

          for n in barrel crate_A_big crate_A_small sack tent resource_lumber resource_stone wheelbarrow weaponrack; do
            cp "$SRC/decoration/props/$n.fbx" "$DST/props/"
          done
          cp "$SRC/decoration/props/hexagons_medieval.png" "$DST/props/"

          mkdir -p Assets/Highfly/ThirdPartyNotices
          cp /tmp/kaykit-adventurers/LICENSE.txt Assets/Highfly/ThirdPartyNotices/KayKit-Adventurers-CC0.txt
          cp /tmp/kaykit-medieval/LICENSE.txt Assets/Highfly/ThirdPartyNotices/KayKit-Medieval-CC0.txt

          echo "Staged KayKit visuals:"
          find Assets/External/KayKit/Adventurers Assets/Highfly/Resources/ClaudeWorldAssets -type f | sort

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-2021.3.45f1-WebGL-ClaudeWorld-${{ hashFiles('Assets/Highfly/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-2021.3.45f1-WebGL-
            Library-2021.3.45f1-

      - name: Free disk for Unity
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Build HIGHFLY ClaudeCraft World WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2021.3.45f1
          targetPlatform: WebGL
          buildsPath: build
          buildName: HIGHFLY-WORLD-LAB
          buildMethod: Highfly.Editor.HighflyBuildPipeline.BuildWebGLClaudeWorld
          allowDirtyBuild: true

      - name: Patch WebGL for mobile fullscreen
        run: |
          # game-ci builds inside a container, so generated WebGL files can be root-owned.
          # Return ownership to the runner before patching the template.
          sudo chown -R "$(id -u):$(id -g)" build/WebGL/HIGHFLY-WORLD-LAB
          python3 - <<'PY'
          from pathlib import Path
          p=Path("build/WebGL/HIGHFLY-WORLD-LAB/index.html")
          s=p.read_text(encoding="utf-8")
          head=r'''
          <meta name="viewport" content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
          <meta name="mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="screen-orientation" content="landscape">
          <style>
          html,body{margin:0!important;padding:0!important;width:100%!important;height:100%!important;overflow:hidden!important;background:#08121d!important}
          #unity-container,#unity-container.unity-desktop,#unity-container.unity-mobile{position:fixed!important;left:0!important;top:0!important;right:0!important;bottom:0!important;inset:0!important;transform:none!important;width:100vw!important;height:100dvh!important;max-width:none!important;max-height:none!important}
          #unity-canvas,#unity-canvas.unity-mobile{position:absolute!important;inset:0!important;width:100vw!important;height:100dvh!important;max-width:none!important;max-height:none!important;display:block!important}
          #unity-footer,#unity-logo,#unity-webgl-logo{display:none!important}
          #highfly-enter{position:fixed;inset:0;z-index:99999;background:#08121d;display:none;align-items:center;justify-content:center;font-family:Arial,sans-serif}
          #highfly-enter button{font-size:22px;font-weight:700;padding:18px 28px;border-radius:12px;border:1px solid #5ee8ff;background:#102c42;color:white}
          </style>
          '''
          boot=r'''
          <div id="highfly-enter"><button type="button">ENTRAR A HIGHFLY</button></div>
          <script>
          (() => {
            const mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            const overlay = document.getElementById("highfly-enter");
            const button = overlay ? overlay.querySelector("button") : null;
            if (mobile && overlay) overlay.style.display = "flex";

            const fit = () => {
              const container = document.getElementById("unity-container");
              const canvas = document.getElementById("unity-canvas");
              if (container) {
                container.className = "unity-mobile";
                container.style.transform = "none";
                container.style.width = "100vw";
                container.style.height = "100dvh";
              }
              if (canvas) {
                canvas.className = "unity-mobile";
                canvas.style.width = "100vw";
                canvas.style.height = "100dvh";
              }
            };

            const enter = async () => {
              fit();
              try {
                const el = document.documentElement;
                if (!document.fullscreenElement && el.requestFullscreen) {
                  await el.requestFullscreen();
                }
              } catch (_) {}
              try {
                if (screen.orientation && screen.orientation.lock) {
                  await screen.orientation.lock("landscape");
                }
              } catch (_) {}
              if (overlay) overlay.style.display = "none";
            };

            if (button) button.addEventListener("click", enter);
            window.addEventListener("resize", fit);
            window.addEventListener("orientationchange", fit);
            fit();
          })();
          </script>
          '''
          # Unity 2021's default WebGL template emits a scary mobile warning
          # even though this HIGHFLY build is intentionally tested on Android.
          s=s.replace("unityShowBanner('WebGL builds are not supported on mobile devices.');", "")
          s=s.replace('canvas.style.width = "960px";', 'canvas.style.width = "100vw";')
          s=s.replace('canvas.style.height = "600px";', 'canvas.style.height = "100dvh";')
          if "viewport-fit=cover" not in s:
              s=s.replace("</head>", head+"\n</head>")
          if 'id="highfly-enter"' not in s:
              s=s.replace("</body>", boot+"\n</body>")
          p.write_text(s,encoding="utf-8")
          print("Patched mobile fullscreen:", p)
          PY

      - name: Inspect WebGL
        if: always()
        run: |
          find build -maxdepth 4 -type f -printf "%p %k KB\n" | sort | head -200 || true
          find build/diagnostics -maxdepth 2 -type f -print -exec cat {} \; || true

      - name: Upload WebGL
        uses: actions/upload-artifact@v4
        with:
          name: HIGHFLY-CLAUDECRAFT-WORLD-WEBGL-v0.1
          path: build/WebGL/HIGHFLY-WORLD-LAB/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HIGHFLY-CLAUDECRAFT-WORLD-DIAGNOSTICS-v0.1
          path: build/diagnostics/**
          if-no-files-found: warn
          retention-days: 7
