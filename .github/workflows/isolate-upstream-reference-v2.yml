name: Isolate Upstream Reference V2

on:
  push:
    paths:
      - '.github/workflows/isolate-upstream-reference-v2.yml'

permissions:
  contents: write

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: highfly-foundation
          fetch-depth: 0
          lfs: true

      - name: Move public upstream outside Unity Assets
        run: |
          mkdir -p UpstreamReference
          [ ! -d Assets/SubspaceHunter ] || git mv Assets/SubspaceHunter UpstreamReference/SubspaceHunter
          [ ! -f Assets/SubspaceHunter.meta ] || git mv Assets/SubspaceHunter.meta UpstreamReference/SubspaceHunter.meta
          [ ! -d Assets/PublicDemo ] || git mv Assets/PublicDemo UpstreamReference/PublicDemo
          [ ! -f Assets/PublicDemo.meta ] || git mv Assets/PublicDemo.meta UpstreamReference/PublicDemo.meta

          cat > UpstreamReference/README.md <<'EOF'
          # SubspaceHunter upstream reference

          Preserved public SubspaceHunter-SAO source and demo content for inspection and selective migration.
          It is outside Unity's `Assets/` directory on `highfly-foundation`, so missing external dependencies cannot block the clean HIGHFLY Android build.
          The untouched imported layout remains preserved on `main`.
          EOF

          rm -f .github/workflows/isolate-upstream-reference.yml
          rm -f .github/workflows/isolate-upstream-reference-v2.yml

      - name: Commit and push
        run: |
          git config user.name 'highfly-foundation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Isolate upstream reference from clean HIGHFLY compile domain'
          git push origin HEAD:highfly-foundation
