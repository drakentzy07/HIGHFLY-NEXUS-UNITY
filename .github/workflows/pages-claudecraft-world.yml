name: Deploy HIGHFLY World Pages

on:
  workflow_dispatch:
  push:
    branches:
      - highfly/claudecraft-world-importer-v01
    paths:
      - ".github/workflows/pages-claudecraft-world.yml"
  workflow_run:
    workflows:
      - "Build HIGHFLY ClaudeCraft World WebGL"
    types:
      - completed

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: claudecraft-world-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Resolve WebGL build run
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
          else
            RUN_ID="$(gh api -H "Accept: application/vnd.github+json" "/repos/drakentzy07/HIGHFLY-NEXUS-UNITY/actions/workflows/webgl-claudecraft-world.yml/runs?branch=highfly%2Fclaudecraft-world-importer-v01&status=success&per_page=1" --jq '.workflow_runs[0].id')"
          fi
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Deploying WebGL artifact from build run $RUN_ID"

      - name: Download matching WebGL artifact
        uses: actions/download-artifact@v4
        with:
          name: HIGHFLY-CLAUDECRAFT-WORLD-WEBGL-v0.1
          path: site
          repository: drakentzy07/HIGHFLY-NEXUS-UNITY
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify WebGL payload
        run: |
          test -s site/index.html
          test -s site/Build/HIGHFLY-WORLD-LAB.loader.js
          test -s site/Build/HIGHFLY-WORLD-LAB.framework.js
          test -s site/Build/HIGHFLY-WORLD-LAB.wasm
          test -s site/Build/HIGHFLY-WORLD-LAB.data
          echo "Artifact source build run: ${{ steps.build.outputs.run_id }}"
          find site -maxdepth 2 -type f -printf "%p %k KB\n" | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
