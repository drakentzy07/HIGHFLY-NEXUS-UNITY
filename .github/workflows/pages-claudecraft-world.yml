name: Deploy HIGHFLY World Pages

on:
  workflow_dispatch:
  push:
    branches:
      - highfly/claudecraft-world-importer-v01
    paths:
      - ".github/workflows/pages-claudecraft-world.yml"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: claudecraft-world-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Download CURRENT world WebGL artifact
        uses: actions/download-artifact@v4
        with:
          name: HIGHFLY-CLAUDECRAFT-WORLD-WEBGL-v0.1
          path: site
          repository: drakentzy07/HIGHFLY-NEXUS-UNITY
          run-id: 35936540999
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify WebGL payload
        run: |
          test -s site/index.html
          test -s site/Build/HIGHFLY-WORLD-LAB.loader.js
          test -s site/Build/HIGHFLY-WORLD-LAB.framework.js
          test -s site/Build/HIGHFLY-WORLD-LAB.wasm
          test -s site/Build/HIGHFLY-WORLD-LAB.data
          echo "Deploying exact world build run 35936540999"
          find site -maxdepth 2 -type f -printf "%p %k KB\n" | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
