name: Build HIGHFLY SUPREME Android

on:
  workflow_dispatch:
  push:
    branches:
      - highfly-supreme

concurrency:
  group: highfly-supreme-android
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android-apk:
    name: Unity Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout HIGHFLY SUPREME
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-2021.3.45f1-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-2021.3.45f1-Android-
            Library-2021.3.45f1-

      - name: Free disk for Unity Android image
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Build HIGHFLY SUPREME APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2021.3.45f1
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: HIGHFLY-NEXUS-SUPREME
          buildsPath: build
          buildMethod: Highfly.Editor.HighflyBuildPipeline.BuildAndroid
          allowDirtyBuild: true

      - name: Verify Supreme APK
        run: |
          test -f build/Android/HIGHFLY-NEXUS-SUPREME.apk
          ls -lh build/Android/HIGHFLY-NEXUS-SUPREME.apk

      - name: Publish HIGHFLY SUPREME Latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="build/Android/HIGHFLY-NEXUS-SUPREME.apk"
          TAG="highfly-supreme-latest"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "${GITHUB_SHA}" \
              --title "HIGHFLY SUPREME Latest" \
              --notes "Latest automatic Android build from the highfly-supreme branch."
          fi

      - name: Print diagnostics on failure
        if: failure()
        run: |
          echo "=== HIGHFLY diagnostics ==="
          find build/diagnostics -maxdepth 1 -type f -print -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \; 2>/dev/null || true
