name: Build HIGHFLY SUPREME Android

on:
  workflow_dispatch:
  push:
    branches:
      - highfly-supreme
    paths:
      - '.github/build-trigger/supreme.txt'

concurrency:
  group: highfly-supreme-android
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android-apk:
    name: Unity Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout HIGHFLY SUPREME
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Restore Unity Library cache
        uses: actions/cache/restore@v4
        with:
          path: Library
          key: Library-2021.3.45f1-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-2021.3.45f1-Android-
            Library-2021.3.45f1-

      - name: Free disk for Unity Android image
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Fetch official KayKit CC0 foundation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/highfly-kaykit
          mkdir -p /tmp/highfly-kaykit
          mkdir -p Assets/External/KayKit/Adventurers
          mkdir -p Assets/External/KayKit/Skeletons
          mkdir -p Assets/External/KayKit/Dungeon
          mkdir -p Assets/External/KayKit/Medieval

          git clone --depth 1 --filter=blob:none --sparse https://github.com/KayKit-Game-Assets/KayKit-Character-Pack-Adventures-1.0.git /tmp/highfly-kaykit/adventurers
          git -C /tmp/highfly-kaykit/adventurers sparse-checkout set addons/kaykit_character_pack_adventures/Characters/fbx addons/kaykit_character_pack_adventures/Assets/fbx
          cp -R /tmp/highfly-kaykit/adventurers/addons Assets/External/KayKit/Adventurers/

          git clone --depth 1 --filter=blob:none --sparse https://github.com/KayKit-Game-Assets/KayKit-Character-Pack-Skeletons-1.0.git /tmp/highfly-kaykit/skeletons
          git -C /tmp/highfly-kaykit/skeletons sparse-checkout set addons/kaykit_character_pack_skeletons/Characters/fbx
          cp -R /tmp/highfly-kaykit/skeletons/addons Assets/External/KayKit/Skeletons/

          git clone --depth 1 --filter=blob:none --sparse https://github.com/KayKit-Game-Assets/KayKit-Dungeon-Remastered-1.0.git /tmp/highfly-kaykit/dungeon
          git -C /tmp/highfly-kaykit/dungeon sparse-checkout set addons/kaykit_dungeon_remastered/Assets/fbx addons/kaykit_dungeon_remastered/Assets/texture
          cp -R /tmp/highfly-kaykit/dungeon/addons Assets/External/KayKit/Dungeon/

          git clone --depth 1 --filter=blob:none --sparse https://github.com/KayKit-Game-Assets/KayKit-Medieval-Hexagon-Pack-1.0.git /tmp/highfly-kaykit/medieval
          git -C /tmp/highfly-kaykit/medieval sparse-checkout set addons/kaykit_medieval_hexagon_pack/Assets/fbx
          cp -R /tmp/highfly-kaykit/medieval/addons Assets/External/KayKit/Medieval/

          test -f Assets/External/KayKit/Adventurers/addons/kaykit_character_pack_adventures/Characters/fbx/RogueHooded.fbx
          test -f Assets/External/KayKit/Skeletons/addons/kaykit_character_pack_skeletons/Characters/fbx/Skeleton_Warrior.fbx
          test -f Assets/External/KayKit/Dungeon/addons/kaykit_dungeon_remastered/Assets/fbx/floor_tile_large.fbx
          test -f Assets/External/KayKit/Dungeon/addons/kaykit_dungeon_remastered/Assets/texture/dungeon_texture.png
          test -f Assets/External/KayKit/Medieval/addons/kaykit_medieval_hexagon_pack/Assets/fbx/buildings/blue/building_tavern_blue.fbx

          echo "HIGHFLY KayKit foundation ready:"
          du -sh Assets/External/KayKit/*

      - name: Build HIGHFLY SUPREME APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2021.3.45f1
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: HIGHFLY-NEXUS-SUPREME
          buildsPath: build
          buildMethod: Highfly.Editor.HighflyBuildPipeline.BuildAndroid
          allowDirtyBuild: true

      - name: Verify Supreme APK
        run: |
          test -f build/Android/HIGHFLY-NEXUS-SUPREME.apk
          ls -lh build/Android/HIGHFLY-NEXUS-SUPREME.apk

      - name: Publish HIGHFLY SUPREME Latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="build/Android/HIGHFLY-NEXUS-SUPREME.apk"
          TAG="highfly-supreme-latest"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "${GITHUB_SHA}" \
              --title "HIGHFLY SUPREME Latest" \
              --notes "Latest automatic Android build from the highfly-supreme branch."
          fi

      - name: Print diagnostics on failure
        if: failure()
        run: |
          echo "=== HIGHFLY diagnostics ==="
          find build/diagnostics -maxdepth 1 -type f -print -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \; 2>/dev/null || true
