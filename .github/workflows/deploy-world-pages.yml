name: Deploy HIGHFLY World Pages

on:
  workflow_run:
    workflows:
      - "Build HIGHFLY World Final FREE WebGL"
      - "Build HIGHFLY World W0-W1 WebGL"
    types:
      - completed
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-world-pages.yml"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: highfly-world-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Resolve successful WebGL run + artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            RUN_ID="$EVENT_RUN_ID"
          else
            RUN_ID="$(
              curl -fsSL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?branch=highfly%2Fworld-isekai-w0-w1-v01&status=success&per_page=50" \
              | jq -r '.workflow_runs[]
                  | select(.path==".github/workflows/webgl-world-final-free.yml")
                  | .id' \
              | head -1
            )"
          fi

          test -n "$RUN_ID"

          ARTIFACT_NAME="$(
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            | jq -r '.artifacts[]
                | select(.expired==false)
                | select(.name | contains("WEBGL"))
                | select(.name | contains("DIAGNOSTICS") | not)
                | .name' \
            | head -1
          )"

          test -n "$ARTIFACT_NAME"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "Publishing WebGL from run $RUN_ID"
          echo "Artifact: $ARTIFACT_NAME"

      - name: Download exact successful WebGL artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          path: site-download
          repository: drakentzy07/HIGHFLY-NEXUS-UNITY
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize + verify playable payload
        run: |
          set -euo pipefail

          INDEX="$(find site-download -type f -name index.html | head -1)"
          test -n "$INDEX"
          ROOT="$(dirname "$INDEX")"

          rm -rf site-publish
          mkdir -p site-publish
          cp -a "$ROOT"/. site-publish/

          test -s site-publish/index.html
          test -n "$(find site-publish/Build -maxdepth 1 -type f -name '*.loader.js' -print -quit)"
          test -n "$(find site-publish/Build -maxdepth 1 -type f -name '*.framework.js' -print -quit)"
          test -n "$(find site-publish/Build -maxdepth 1 -type f -name '*.wasm' -print -quit)"
          test -n "$(find site-publish/Build -maxdepth 1 -type f -name '*.data' -print -quit)"

          echo "HIGHFLY World WebGL payload verified"
          find site-publish/Build -maxdepth 1 -type f -printf "%f %k KB\n" | sort
          du -sh site-publish

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-publish

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish URL
        run: |
          echo "HIGHFLY WORLD LIVE: ${{ steps.deployment.outputs.page_url }}"
